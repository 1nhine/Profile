<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Komura | Profile</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #b81b9d;
            --accent-glow: rgba(184, 27, 157, 0.65);
            --accent-light: #f43f5e;
            --bg-card: rgba(15, 15, 18, 0.72);
            --border-card: rgba(255, 255, 255, 0.12);
            --text-color: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: url(https://r2.guns.lol/77b0701e-5346-4bbf-9419-67fc8c79ca47.png) 16 16, auto !important;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* Video nền */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -3;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.45) contrast(1.1);
        }

        /* Canvas hiệu ứng */
        #snow-canvas, #trail-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #snow-canvas { z-index: -2; }
        #trail-canvas { z-index: 99; }

        /* Màn hình Enter */
        #enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
            user-select: none;
        }

        #enter-overlay h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: lowercase;
            text-shadow: 0 0 15px var(--accent-glow), 0 0 30px var(--accent);
            animation: pulse 1.6s ease-in-out infinite;
        }

        #enter-overlay p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.35; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* Card Wrapper 3D */
        .card-wrapper {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            z-index: 10;
        }

        .profile-container {
            width: 90vw;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 24px 24px 24px;
            box-shadow: 0 0 45px rgba(0, 0, 0, 0.8), 0 0 35px var(--accent-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .profile-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(184, 27, 157, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* Avatar & Status */
        .avatar-box {
            position: relative;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .avatar-box:hover .avatar {
            transform: scale(1.06) rotate(3deg);
        }

        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 8px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #ed4245;
            border: 3px solid #111;
            box-shadow: 0 0 10px rgba(237, 66, 69, 0.8);
        }

        /* Tên & Badges */
        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .username {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 16px var(--accent-glow);
        }

        .badges-bar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge-icon {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3px;
            transition: 0.2s;
        }

        .badge-icon:hover {
            transform: translateY(-2px) scale(1.15);
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .badge-icon svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
        }

        /* Typewriter Box */
        .typewriter-box {
            font-size: 14px;
            color: #e5e7eb;
            font-weight: 600;
            min-height: 22px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: var(--accent);
            margin-left: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Discord Status Mockup */
        .discord-status-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .game-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .game-icon svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .status-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .status-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-light);
            letter-spacing: 0.5px;
        }

        .status-detail {
            font-size: 13px;
            color: #ffffff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-state {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Player Bar Nâng Cấp Đầy Đủ Nút */
        .player-bar {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .song-desc {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-align: left;
            max-width: 60%;
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            height: 16px;
            gap: 2.5px;
            flex-shrink: 0;
        }

        .eq-bar {
            width: 3px;
            height: 4px;
            background-color: var(--accent);
            border-radius: 1px;
            transition: height 0.2s;
        }

        .playing .eq-bar:nth-child(1) { animation: bounce 0.9s ease-in-out infinite; }
        .playing .eq-bar:nth-child(2) { animation: bounce 0.7s ease-in-out infinite 0.2s; }
        .playing .eq-bar:nth-child(3) { animation: bounce 1.1s ease-in-out infinite 0.4s; }
        .playing .eq-bar:nth-child(4) { animation: bounce 0.8s ease-in-out infinite 0.1s; }

        @keyframes bounce {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        .song-name {
            font-size: 12.5px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px;
        }

        .ctrl-btn svg {
            width: 17px;
            height: 17px;
            fill: #ffffff;
            transition: 0.2s;
        }

        .ctrl-btn:hover svg {
            fill: var(--accent);
            transform: scale(1.15);
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent);
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 14px;
            width: 100%;
            margin-top: 4px;
        }

        .social-link {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .social-link svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            transition: 0.2s;
        }

        .social-link img {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            object-fit: cover;
        }

        .social-link:hover {
            background: var(--accent);
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 0 20px var(--accent);
            border-color: var(--accent);
        }

        .views-count {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .views-count svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>

            },
            {
                title: "Quê Tôi",
                url: "https://raw.githubusercontent.com/1nhine/Profile/main/bai6.mp3"
            }
        ];

        let currentTrackIndex = 0;
        const audio = document.getElementById('bg-audio');
        const eq = document.getElementById('equalizer');
        const progressBar = document.getElementById('progress-bar');
        const playIcon = document.getElementById('play-icon');
        const songNameElem = document.getElementById('song-name');

        function loadTrack(index) {
            currentTrackIndex = index;
            audio.src = playlist[currentTrackIndex].url;
            songNameElem.textContent = playlist[currentTrackIndex].title;
            progressBar.style.width = '0%';
        }

        // Tải bài đầu tiên
        loadTrack(0);

        function enterSite() {
            const overlay = document.getElementById('enter-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.visibility = 'hidden', 800);

            audio.volume = 0.5;
            audio.play().then(() => {
                eq.classList.add('playing');
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            }).catch(e => console.log(e));
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                eq.classList.add('playing');
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                audio.pause();
                eq.classList.remove('playing');
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
            eq.classList.add('playing');
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
            eq.classList.add('playing');
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        // Tự động chuyển bài khi hết nhạc
        audio.onended = () => {
            nextTrack();
        };

        function toggleMute() {
            audio.muted = !audio.muted;
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        };

        function seekAudio(e) {
            const container = e.currentTarget;
            const clickPos = (e.pageX - container.getBoundingClientRect().left) / container.offsetWidth;
            if (audio.duration) {
                audio.currentTime = clickPos * audio.duration;
            }
        }

        // Chữ Typewriter
        const words = [
            "Red Flash Clan Leader ⚡",
            "Developing bằng AI 100%",
            "Kém Cỏi Về Mọi Thứ 😔",
            "Listening to: Komura Playlist 🎧"
        ];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typeElem = document.getElementById('typewriter-text');

        function type() {
            const currentWord = words[wordIndex];
            if (isDeleting) {
                typeElem.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typeElem.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;
            }

            let speed = isDeleting ? 40 : 80;

            if (!isDeleting && charIndex === currentWord.length) {
                speed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
                speed = 500;
            }

            setTimeout(type, speed);
        }
        type();

        // 3D Tilt
        const cardWrapper = document.getElementById('card-wrapper');
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            cardWrapper.style.transform = `rotateY(${-xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Hạt nền tuyết rơi
        const snowCanvas = document.getElementById('snow-canvas');
        const sCtx = snowCanvas.getContext('2d');
        let sw = snowCanvas.width = window.innerWidth;
        let sh = snowCanvas.height = window.innerHeight;

        const snowFlakes = [];
        for (let i = 0; i < 65; i++) {
            snowFlakes.push({
                x: Math.random() * sw,
                y: Math.random() * sh,
                r: Math.random() * 2.5 + 0.8,
                sy: Math.random() * 1.2 + 0.4,
                sx: Math.random() * 0.6 - 0.3,
                op: Math.random() * 0.7 + 0.2
            });
        }

        function drawSnow() {
            sCtx.clearRect(0, 0, sw, sh);
            sCtx.fillStyle = '#b81b9d';
            for (let p of snowFlakes) {
                sCtx.beginPath();
                sCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                sCtx.globalAlpha = p.op;
                sCtx.fill();
                p.y += p.sy;
                p.x += p.sx;
                if (p.y > sh) { p.y = -5; p.x = Math.random() * sw; }
            }
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // Vệt sáng chuột Sparkle
        const trailCanvas = document.getElementById('trail-canvas');
        const tCtx = trailCanvas.getContext('2d');
        let tw = trailCanvas.width = window.innerWidth;
        let th = trailCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            sw = snowCanvas.width = tw = trailCanvas.width = window.innerWidth;
            sh = snowCanvas.height = th = trailCanvas.height = window.innerHeight;
        });

        const trails = [];
        document.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                trails.push({
                    x: e.pageX,
                    y: e.pageY,
                    r: Math.random() * 3 + 1,
                    alpha: 1,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5
                });
            }
        });

        function drawTrails() {
            tCtx.clearRect(0, 0, tw, th);
            for (let i = 0; i < trails.length; i++) {
                const t = trails[i];
                tCtx.beginPath();
                tCtx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                tCtx.fillStyle = '#f43f5e';
                tCtx.globalAlpha = t.alpha;
                tCtx.shadowBlur = 10;
                tCtx.shadowColor = '#b81b9d';
                tCtx.fill();

                t.x += t.vx;
                t.y += t.vy;
                t.alpha -= 0.035;

                if (t.alpha <= 0) {
                    trails.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(drawTrails);
        }
        drawTrails();
    </script>
</body>
</html>
